<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Магазин</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--tg-theme-bg-color, #18222d);
      color: var(--tg-theme-text-color, #ffffff);
      margin: 0;
      padding: 16px;
    }
    h2 {
      margin-top: 0;
      font-size: 20px;
    }
    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 12px;
      margin-top: 16px;
    }
    .product-card {
      background: var(--tg-theme-secondary-bg-color, #213040);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .product-title {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .product-price {
      font-size: 15px;
      font-weight: bold;
      color: #64b5f6;
    }
    .error-msg {
      color: #ff6b6b;
      background: rgba(255, 0, 0, 0.1);
      padding: 10px;
      border-radius: 8px;
      font-size: 13px;
    }
    .loading {
      color: #888;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <h2>🛍 Каталог товарів</h2>
  
  <div id="products-container" class="products-grid">
    <div class="loading">Завантаження товарів...</div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    const API_URL = "https://178.128.246.254.sslip.io/api";

    async function loadProducts() {
      const container = document.getElementById('products-container');
      try {
        const res = await fetch(`${API_URL}/products`, {
          headers: {
            "ngrok-skip-browser-warning": "true"
          }
        });

        if (!res.ok) {
          throw new Error(`Помилка сервера: ${res.status}`);
        }

        const products = await res.json();

        if (!products || products.length === 0) {
          container.innerHTML = '<p>Товари відсутні</p>';
          return;
        }

        container.innerHTML = products.map(p => `
          <div class="product-card">
            <div class="product-title">${p.title}</div>
            <div class="product-price">${p.price} грн</div>
          </div>
        `).join('');

      } catch (e) {
        console.error("Помилка:", e);
        container.innerHTML = <div class="error-msg">Помилка завантаження: ${e.message}</div>;
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      loadProducts();
    });
  </script>
</body>
</html>

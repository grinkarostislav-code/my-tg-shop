<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AutoParts Store</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-color: #12131C;
            --card-bg: #1C1E2D;
            --accent-color: #E53935;
            --text-main: #FFFFFF;
            --text-sub: #8E8E93;
            --border-color: #2C2D3C;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding-bottom: 80px; }

        header {
            background: var(--card-bg);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo { font-size: 1.2rem; font-weight: bold; color: var(--text-main); display: flex; align-items: center; gap: 8px; }
        .logo i { color: var(--accent-color); }

        .nav-tabs { display: flex; gap: 10px; padding: 12px 20px; background: #181926; overflow-x: auto; }
        .tab-btn {
            background: transparent; border: 1px solid var(--border-color); color: var(--text-sub);
            padding: 8px 16px; border-radius: 20px; font-size: 0.85rem; cursor: pointer; white-space: nowrap;
        }
        .tab-btn.active { background: var(--accent-color); color: #fff; border-color: var(--accent-color); }

        .container { padding: 15px; }

        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; }
        .product-card {
            background: var(--card-bg); border-radius: 12px; overflow: hidden;
            border: 1px solid var(--border-color); display: flex; flex-direction: column;
        }
        .product-img { width: 100%; height: 130px; object-fit: cover; background: #252836; }
        .product-info { padding: 12px; display: flex; flex-direction: column; flex-grow: 1; justify-content: space-between; }
        .product-title { font-size: 0.9rem; font-weight: 600; margin-bottom: 6px; line-height: 1.2; }
        .product-desc { font-size: 0.75rem; color: var(--text-sub); margin-bottom: 10px; line-clamp: 2; display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; }
        .product-bottom { display: flex; justify-content: space-between; align-items: center; margin-top: auto; }
        .product-price { font-size: 1rem; font-weight: bold; color: #4CAF50; }
        .add-btn {
            background: var(--accent-color); color: white; border: none; width: 32px; height: 32px;
            border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center;
        }

        .admin-panel { background: var(--card-bg); padding: 20px; border-radius: 12px; border: 1px solid var(--border-color); }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 0.8rem; color: var(--text-sub); margin-bottom: 5px; }
        .form-control {
            width: 100%; padding: 10px; background: #12131C; border: 1px solid var(--border-color);
            border-radius: 8px; color: white; font-size: 0.9rem;
        }
        .btn-submit {
            width: 100%; padding: 12px; background: var(--accent-color); color: white;
            border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px;
        }
        .calc-preview { background: #252836; padding: 10px; border-radius: 8px; margin-top: 10px; font-size: 0.85rem; color: #4CAF50; }

        .cart-bar {
            position: fixed; bottom: 0; left: 0; right: 0; background: var(--card-bg);
            padding: 15px 20px; border-top: 1px solid var(--border-color);
            display: flex; justify-content: space-between; align-items: center; z-index: 1000;
        }
        .cart-btn {
            background: #4CAF50; color: white; border: none; padding: 10px 20px;
            border-radius: 8px; font-weight: bold; cursor: pointer;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <header>
        <div class="logo"><i class="fa-solid fa-car"></i> AutoParts</div>
        <button class="tab-btn" onclick="toggleAdmin()"><i class="fa-solid fa-lock"></i> Адмінка</button>
    </header>

    <div class="nav-tabs" id="categories">
        <button class="tab-btn active" onclick="filterCategory('all')">Усі товари</button>
        <button class="tab-btn" onclick="filterCategory('Діагностика')">Діагностика</button>
        <button class="tab-btn" onclick="filterCategory('Запчастини')">Запчастини</button>
        <button class="tab-btn" onclick="filterCategory('Аксесуари')">Аксесуари</button>
    </div>

    <div class="container">
        <div id="catalog-view">
            <div id="loading" style="text-align: center; padding: 40px; color: var(--text-sub);">
                <i class="fa-solid fa-spinner fa-spin fa-2x"></i><br><br>Завантаження каталогу...
            </div>
            <div class="products-grid hidden" id="products-grid"></div>
        </div>

        <div id="admin-view" class="admin-panel hidden">
            <h2 style="margin-bottom: 15px; font-size: 1.1rem;"><i class="fa-solid fa-plus-circle"></i> Додати новий товар</h2>
            <form id="add-product-form" onsubmit="submitProduct(event)">
                <div class="form-group">
                    <label>Назва товару</label>
                    <input type="text" id="title" class="form-control" placeholder="напр. VAG HEX-V2" required>
                </div>
                <div class="form-group">
                    <label>Категорія</label>
                    <select id="category" class="form-control">
                        <option value="Діагностика">Діагностика</option>
                        <option value="Запчастини">Запчастини</option>
                        <option value="Аксесуари">Аксесуари</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Опис</label>
                    <textarea id="description" class="form-control" rows="2" placeholder="Короткий опис..."></textarea>
                </div>
                <div class="form-group" style="display: flex; gap: 10px;">
                    <div style="flex: 1;">
                        <label>Ціна в Китаї ($)</label>
                        <input type="number" step="0.01" id="price_china" class="form-control" oninput="calculatePrice()" required>
                    </div>
                    <div style="flex: 1;">
                        <label>Вага (кг)</label>
                        <input type="number" step="0.01" id="weight_kg" class="form-control" placeholder="0.3" oninput="calculatePrice()" required>
                    </div>
                </div>
                <div class="calc-preview" id="calc-preview">
                    Розрахункова ціна в Україні: <b>0 грн</b> ($17.1/кг доставка)
                </div>
                <div class="form-group" style="margin-top: 15px;">
                    <label>URL Картинки</label>
                    <input type="url" id="image_url" class="form-control" placeholder="https://..." required>
                </div>
                <button type="submit" class="btn-submit">Опублікувати товар</button>
            </form>
        </div>
    </div>

    <div class="cart-bar hidden" id="cart-bar">
        <div>
            <span style="font-size: 0.8rem; color: var(--text-sub);">Разом:</span>
            <div style="font-size: 1.1rem; font-weight: bold; color: #4CAF50;" id="cart-total">0 грн</div>
        </div>
        <button class="cart-btn" onclick="checkout()">Оформити (<span id="cart-count">0</span>)</button></div>

    <script>
        // Використовуємо відносний шлях для API
        const API_URL = "/api";
        let products = [];
        let cart = [];

        const tg = window.Telegram?.WebApp;
        if (tg) { tg.expand(); }

        async function loadProducts() {
            try {
                const res = await fetch(`${API_URL}/products`);
                if (!res.ok) throw new Error("HTTP error " + res.status);
                products = await res.json();
                renderProducts(products);
            } catch (err) {
                console.error(err);
                document.getElementById('loading').innerHTML = '<span style="color: #E53935;"><i class="fa-solid fa-triangle-exclamation"></i> Помилка завантаження. Перевірте зʼєднання.</span>';
            }
        }

        function renderProducts(items) {
            const grid = document.getElementById('products-grid');
            document.getElementById('loading').classList.add('hidden');
            grid.classList.remove('hidden');
            grid.innerHTML = '';

            if (items.length === 0) {
                grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: var(--text-sub);">Товари відсутні</div>';
                return;
            }

            items.forEach(p => {
                grid.innerHTML += `
                    <div class="product-card">
                        <img src="${p.image_url}" class="product-img" alt="${p.title}" onerror="this.src='https://via.placeholder.com/150'">
                        <div class="product-info">
                            <div class="product-title">${p.title}</div>
                            <div class="product-desc">${p.description || ''}</div>
                            <div class="product-bottom">
                                <div class="product-price">${p.price_uah} ₴</div>
                                <button class="add-btn" onclick="addToCart(${p.id})"><i class="fa-solid fa-plus"></i></button>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function filterCategory(cat) {
            document.querySelectorAll('.nav-tabs .tab-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            if (cat === 'all') renderProducts(products);
            else renderProducts(products.filter(p => p.category === cat));
        }

        function calculatePrice() {
            const priceChina = parseFloat(document.getElementById('price_china').value) || 0;
            const weight = parseFloat(document.getElementById('weight_kg').value) || 0;
            const deliveryCost = weight * 17.1;
            const totalUSD = priceChina + deliveryCost;
            const totalUAH = Math.round(totalUSD * 41.5);

            document.getElementById('calc-preview').innerHTML = 
                Розрахункова ціна в Україні: <b>${totalUAH} грн</b> (Доставка: $${deliveryCost.toFixed(2)});
        }

        async function submitProduct(e) {
            e.preventDefault();
            const data = {
                title: document.getElementById('title').value,
                category: document.getElementById('category').value,
                description: document.getElementById('description').value,
                price_china: parseFloat(document.getElementById('price_china').value),
                weight_kg: parseFloat(document.getElementById('weight_kg').value),
                image_url: document.getElementById('image_url').value
            };

            const res = await fetch(`${API_URL}/products`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            if (res.ok) {
                alert('Товар успішно додано!');
                toggleAdmin();
                loadProducts();
            }
        }

        function toggleAdmin() {
            document.getElementById('catalog-view').classList.toggle('hidden');
            document.getElementById('admin-view').classList.toggle('hidden');
            document.getElementById('categories').classList.toggle('hidden');
        }

        function addToCart(id) {
            const item = products.find(p => p.id === id);
            if (item) {
                cart.push(item);
                updateCart();
            }
        }

        function updateCart() {
            const bar = document.getElementById('cart-bar');
            if (cart.length > 0) {
                bar.classList.remove('hidden');
                const total = cart.reduce((sum, p) => sum + p.price_uah, 0);
                document.getElementById('cart-total').innerText = ${total} ₴;
                document.getElementById('cart-count').innerText = cart.length;
            } else {
                bar.classList.add('hidden');
            }
        }

        function checkout() {
            if (tg) {
                tg.sendData(JSON.stringify(cart));
            } else {
                alert('Замовлення оформлено!');
            }
        }

        loadProducts();
    </script>
</body>
</html>
